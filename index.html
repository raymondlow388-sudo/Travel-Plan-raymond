let D=null,activeTab='home';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function maps(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}function directions(origin,dest,way=[]){let u='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin)+'&destination='+encodeURIComponent(dest);if(way.length)u+='&waypoints='+encodeURIComponent(way.join('|'));return u}
function progress(){let a=new Date('2027-01-31T00:00:00+08:00'),b=new Date('2027-02-11T23:59:59+01:00'),n=new Date();return Math.max(0,Math.min(100,(n-a)/(b-a)*100))}
function hero(){return `<header class="hero"><div class="eyebrow">WINTER ROAD TRIP · 5 TRAVELLERS</div><h1>🇫🇮 Finland → 🇳🇴 Norway</h1><p>${esc(D.trip.start_date)} — ${esc(D.trip.end_date)} · ${D.trip.days}D${D.trip.nights}N</p><p>${esc(D.trip.route)}</p><div class="chips"><span class="chip">✈️ 5 Flights</span><span class="chip">🚆 VR265 Sleeper</span><span class="chip">🚗 XC90 AWD</span><span class="chip">🌌 Aurora Plan</span></div></header>`}
function nextFlight(){let n=new Date();return D.flights.map(f=>({f,t:new Date(f.date+'T'+(f.departure_local||'00:00')+':00+01:00')})).find(x=>x.t>n)||{f:D.flights[0],t:null}}
function home(){let n=nextFlight();return hero()+`<section class="section"><div class="grid2"><div class="card"><div class="label">Trip progress</div><div class="stat">${Math.round(progress())}%</div><div class="small">2027 winter journey</div></div><div class="card"><div class="label">Self drive</div><div class="stat">5 days</div><div class="small">EVE → Lofoten → EVE</div></div></div></section><section class="section"><div class="card next"><div class="next-title"><span class="label">NEXT TRANSPORT</span><span class="pill">${esc(n.f.flight_number)}</span></div><div class="big">${esc(n.f.route)}</div><div class="small">${esc(n.f.date)} · ${esc(n.f.departure_local||'')} · ${esc(n.f.airline)}</div><div class="countdown" id="nextcd">⏳ ${n.t?cd(n.t):'时间待确认'}</div><button class="btn ghost" onclick="go('plan')">查看完整行程 →</button></div></section>${routeOverview()}${drivePreview()}${auroraPreview()}`}
function routeOverview(){let nodes=[['HEL','Helsinki'],['RVN','Rovaniemi'],['TOS','Tromsø'],['SVL','Svolvær'],['REI','Reine'],['EVE','Evenes'],['OSL','Oslo']];return `<section class="section"><div class="section-row"><div><h2>🗺️ 全程路线</h2><div class="sub">跨国交通 + Lofoten 自驾</div></div><button class="btn ghost" onclick="go('map')">打开地图</button></div><div class="card"><div class="route-strip">${nodes.map((x,i)=>`${i?'<div class="route-line"></div>':''}<div class="route-node"><div class="dot"></div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></div></section>`}
function drivePreview(){let c=D.car_rental;return `<section class="section"><div class="card drive-hero"><div class="drive-top"><div><div class="label" style="color:#9fb3c8">LOFOTEN SELF DRIVE</div><div class="car">🚗 ${esc(c.vehicle)}</div><div class="small" style="color:#b9c9d8">${esc(c.company)} · 06 Feb → 10 Feb</div></div><span class="pill">4WD</span></div><div class="drive-grid"><div class="kv"><small>PICKUP</small><b>EVE Airport</b></div><div class="kv"><small>RETURN</small><b>EVE Airport</b></div><div class="kv"><small>MODE</small><b>WINTER</b></div></div><button class="btn" style="background:#fff;color:#07111f" onclick="go('drive')">进入自驾控制台 →</button></div></section>`}
function auroraPreview(){return `<section class="section"><div class="section-row"><div><h2>🌌 Aurora Windows</h2><div class="sub">按原定计划预留弹性</div></div><button class="btn ghost" onclick="go('more')">更多</button></div><div class="grid2">${D.aurora_plan.slice(-2).map(a=>`<div class="card"><div class="label">${esc(a.date)}</div><b>${esc(a.location)}</b><div class="small">${esc(a.time)}</div><div style="margin-top:5px">${esc(a.label)}</div></div>`).join('')}</div></section>`}
