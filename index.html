/* Animated aviation countdown */
.aviation-card{position:relative;overflow:hidden;color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:18px;background:radial-gradient(circle at 85% 15%,rgba(69,182,255,.28),transparent 28%),linear-gradient(145deg,#061321,#0c2639 55%,#07111d);box-shadow:0 18px 45px rgba(7,18,31,.22)}

.aviation-head{display:flex;justify-content:space-between;align-items:center}
.aviation-label{font-size:9px;letter-spacing:.13em;color:#9fc4dc;font-weight:900}

function home(){let n=nextFlight();return hero()+`<section style="background:#071a27;padding:0 0 10px"><div class="aviation-card">${aviationCard(n).match(/<div class="aviation-card">([\s\S]*)<\/div>$/)?.[1]||''}</div></section><div class="cover-destinations"><div class="cover-dest" style="--photo:url('https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=700&q=80')"><b>HELSINKI</b><span>Design & Culture</span></div><div class="cover-dest" style="--photo:url('https://images.unsplash.com/photo-1517825738774-7de9363a006c?auto=format&fit=crop&w=700&q=80')"><b>ROVANIEMI</b><span>Arctic Magic</span></div><div class="cover-dest" style="--photo:url('https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=700&q=80')"><b>TROMSØ</b><span>Gateway to the Arctic</span></div><div class="cover-dest" style="--photo:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=700&q=80')"><b>LOFOTEN</b><span>Mountains & Ocean</span></div><div class="cover-dest" style="--photo:url('https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=700&q=80')"><b>OSLO</b><span>City by the Fjord</span></div></div><div class="cover-stats"><div class="cover-stat"><b>12</b><span>Days</span></div><div class="cover-stat"><b>11</b><span>Nights</span></div><div class="cover-stat"><b>5</b><span>Destinations</span></div><div class="cover-stat"><b>6</b><span>Flights / Ferries</span></div><div class="cover-stat"><b>1</b><span>Road Trip</span></div><div class="cover-stat"><b>∞</b><span>Memories</span></div></div>${routeOverview()}${drivePreview()}${auroraPreview()}`}
function routeOverview(){return `<section class="journey-overview"><div class="eyebrow2">THE JOURNEY</div><h2>JOURNEY OVERVIEW</h2><p>From vibrant Nordic cities to Arctic wilderness — a 12-day journey through Finland and Norway's most stunning landscapes.</p><div class="overview-links"><div><strong>⌂</strong>PEOPLE<span>Family & Friends</span></div><div><strong>⌖</strong>PLACES<span>Iconic Destinations</span></div><div><strong>◫</strong>ADVENTURES<span>Once in a Lifetime</span></div><div><strong>♡</strong>STORIES<span>To Be Continued</span></div></div></section><section class="home-dark-route"><div class="label" style="color:#89a5ad">OUR ROUTE</div><h2>FROM CITIES TO ARCTIC WILDERNESS</h2><div class="sub">Helsinki → Rovaniemi → Tromsø → Lofoten → Oslo</div></section>`}
function drivePreview(){let c=D.car_rental;return `<section class="section"><div class="card drive-hero"><div class="drive-top"><div><div class="label" style="color:#9fb3c8">LOFOTEN SELF DRIVE</div><div class="car">🚗 ${esc(c.vehicle)}</div><div class="small" style="color:#b9c9d8">${esc(c.company)} · 06 Feb → 10 Feb</div></div><span class="pill">4WD</span></div><div class="drive-grid"><div class="kv"><small>PICKUP</small><b>EVE Airport</b></div><div class="kv"><small>RETURN</small><b>EVE Airport</b></div><div class="kv"><small>MODE</small><b>WINTER</b></div></div><button class="btn" style="background:#fff;color:#07111f" onclick="go('drive')">进入自驾控制台 →</button></div></section>`}
function auroraPreview(){return `<section class="section"><div class="section-row"><div><h2>🌌 Aurora Windows</h2><div class="sub">按原定计划预留弹性</div></div><button class="btn ghost" onclick="go('more')">更多</button></div><div class="grid2">${D.aurora_plan.slice(-2).map(a=>`<div class="card"><div class="label">${esc(a.date)}</div><b>${esc(a.location)}</b><div class="small">${esc(a.time)}</div><div style="margin-top:5px">${esc(a.label)}</div></div>`).join('')}</div></section>`}

    document.querySelector("#mapDayMeta").textContent=r.meta;document.querySelector("#mapDayTitle2").textContent=r.label+" · "+r.title;document.querySelector("#mapDayMeta2").textContent=r.meta;
    document.querySelector("#mapSafetyText").textContent=r.safe;
    document.querySelector("#mapDirections").href=directions(r.stops[0][1]+" Norway",r.stops[r.stops.length-1][1]+" Norway");

    <div class="map-safety"><b>🌅 天黑安全线</b><div class="safe-line"></div><div class="safe-labels"><span>☀️ 白天</span><span>⚠️ 开始返程</span><span>🌙 不再长途驾驶</span></div><div id="mapSafetyText" style="margin-top:8px;font-size:11px;line-height:1.5">建议下午开始收缩路线，天黑前回到当天住所。</div></div>

function cd(t){let ms=t-new Date();if(ms<=0)return'已到时间';let s=Math.floor(ms/1000),d=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);return `${d}天 ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`}
function plan(){return hero()+`<section class="section"><div class="section-row"><div><h2>📅 12 天时间轴</h2><div class="sub">点击每天查看详细时间安排</div></div><span class="pill">31 JAN — 11 FEB</span></div><div class="timeline">${D.daily_itinerary.map(day).join('')}</div></section>`}
function day(d){let links=Object.entries(d.google_maps||{}).map(([n,u])=>`<a class="btn ghost" target="_blank" href="${u}">📍 ${esc(n)}</a>`).join('');return `<article class="day" id="day-${d.day}" onclick="this.classList.toggle('open')"><div class="dayhead"><span class="daynum">D${d.day}</span><span class="date">${esc(d.date)} · ${esc(d.weekday)}</span></div><div class="route2">${esc(d.location)}</div><div class="meta">${esc((d.transport||[]).join(' · '))}<br>住宿：${esc(d.overnight)}</div><div class="details">${(d.schedule||[]).map(x=>`<div class="item"><div class="t">${esc(x.time||'')}</div>${esc(x.activity)}</div>`).join('')}<div>${links}</div>${(d.notes||[]).map(n=>`<div class="warning">⚠️ ${esc(n)}</div>`).join('')}</div></article>`}
function drive(){let c=D.car_rental;let days=D.daily_itinerary.filter(d=>d.day>=6&&d.day<=10);return hero()+`<section class="section"><div class="card drive-hero"><div class="label" style="color:#9fb3c8">SELF DRIVE CONTROL</div><div class="car">🚙 ${esc(c.vehicle)}</div><div class="small" style="color:#b9c9d8">${esc(c.company)} · 06 Feb → 10 Feb · 5 travellers</div><div class="drive-grid"><div class="kv"><small>PICKUP</small><b>06/02 · EVE</b></div><div class="kv"><small>RETURN</small><b>10/02 · EVE</b></div><div class="kv"><small>DRIVE</small><b>WINTER</b></div></div><div class="warning">❄️ 4WD 只是提升牵引力，不能消除冰雪路面的刹车风险。每天出发前检查天气、道路和封路信息。</div></div></section><section class="section"><h2>🚗 每日驾驶计划</h2><div class="sub">重点路段 + 行程节奏</div>${days.map(d=>`<div class="drive-day"><div class="drive-date">D${d.day} · ${esc(d.date)}</div><div class="drive-route">${esc(d.location)}</div><div class="small">${esc((d.transport||[]).join(' · '))}</div><button class="btn ghost" onclick="goDay(${d.day})">查看当天计划 →</button></div>`).join('')}</section><section class="section"><h2>⚠️ Winter Drive Checklist</h2><div class="card">${D.preparation_and_packing.car_and_road_trip.map((x,i)=>`<label class="check"><input type="checkbox" data-drive="${i}"> <span>${esc(x)}</span></label>`).join('')}</div></section>`}
function more(){return hero()+`<section class="section"><h2>✈️ 航班</h2><div class="sub">所有主要交通</div><div class="rail">${D.flights.map(f=>`<div class="flight"><div class="flight-top"><b>${esc(f.airline)}</b><span class="pill">${esc(f.flight_number)}</span></div><div class="flight-route"><div><div class="airport">${esc((f.route||'').split(' → ')[0])}</div><div class="small">${esc(f.departure_local||'')}</div></div><div class="arrow">→</div><div><div class="airport">${esc((f.route||'').split(' → ').slice(-1)[0])}</div><div class="small">${esc(f.final_arrival_local||f.arrival_local||'')}</div></div></div><div class="small">${esc(f.date)}</div></div>`).join('')}</div></section><section class="section"><h2>📍 主要地点</h2><div class="place-grid">${Object.entries(D.google_maps||{}).map(([n,u])=>`<div class="place"><b>${esc(n)}</b><a class="btn ghost" target="_blank" href="${u}">导航 →</a></div>`).join('')}</div></section><section class="section"><h2>🧳 行前准备</h2><div class="card">${Object.entries(D.preparation_and_packing).map(([k,arr])=>`<div class="label" style="margin-top:8px">${esc(k)}</div>${arr.map((x,i)=>`<label class="check"><input type="checkbox" data-prep="${esc(k)}-${i}"> <span>${esc(x)}</span></label>`).join('')}`).join('')}</div></section>`}
function render(tab){activeTab=tab;document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#app').innerHTML=tab==='home'?home():tab==='map'?mapPage():tab==='plan'?plan():tab==='drive'?drive():more();loadChecks();updateTimers()}
function go(tab){render(tab);window.scrollTo({top:0,behavior:'smooth'})}function goDay(n){render('plan');setTimeout(()=>{let e=$('#day-'+n);if(e){e.classList.add('open');e.scrollIntoView({behavior:'smooth',block:'center'})}},80)}
