/* Animated aviation countdown */

function nextFlight(){let n=new Date();return D.flights.map(f=>({f,t:new Date(f.date+'T'+(f.departure_local||'00:00')+':00+01:00')})).find(x=>x.t>n)||{f:D.flights[0],t:null}}
