eight:800;background:#eef4ff;color:var(--blue);padding:6px 8px;border-radius:999px}.today-card{background:#fff}.mini-label{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em}.today-title{font-size:18px;font-weight:900;margin-top:4px}.timeline{position:relative;padding-left:8px}.day{position:relative;margin:0 0 12px 12px;padding:15px 15px 14px 18px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 18px rgba(15,23,42,.045)}.day:before{content:"";position:absolute;left:-7px;top:21px;width:12px;height:12px;background:var(--blue);border-radius:50%;box-shadow:0 0 0 4px #e7efff}.day:after{content:"";position:absolute;left:-2px;top:35px;bottom:-14px;width:2px;background:#dce5f2}.day:last-child:after{display:none}.dayhead{display:flex;justify-content:space-between;gap:8px}.daynum{font-weight:900;color:var(--blue)}.date{font-size:11px;color:var(--muted)}.route2{font-weight:900;margin:6px 0}.meta{font-size:11px;color:var(--muted);line-height:1.5}.details{display:none;margin-top:12px;padding-top:9px;border-top:1px solid var(--line)}.day.open .details{display:block}.item{padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}.item:last-child{border-bottom:0}.item .t{font-size:11px;color:var(--blue);font-weight:800;margin-bottom:2px}.maps{display:inline-block;margin-top:7px;color:var(--blue);text-decoration:none;font-size:11px;font-weight:800}.rail{display:flex;gap:11px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px}.rail::-webkit-scrollbar{display:none}.flight{min-width:88%;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.airline{font-weight:900}.flight-title{font-size:11px;color:var(--muted);margin-top:3px}.flight-route{display:grid;grid-template-columns:1fr 38px 1fr;align-items:center;gap:5px;margin:16px 0}.airport{font-size:23px;font-weight:900}.city{font-size:11px;color:var(--muted);margin-top:2px}.arrow{text-align:center;color:var(--blue);font-size:20px}.countdown{font-weight:900;color:var(--blue);font-size:13px}.small{font-size:11px;color:var(--muted);line-height:1.5}.place-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.place{padding:14px;background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.place b{font-size:14px}.place .maps{margin-top:9px}.kv{background:#f7f9fc;border-radius:14px;padding:11px}.kv small{display:block;color:var(--muted);font-size:9px}.kv strong{display:block;margin-top:3px;font-size:12px}.car-title{font-size:20px;font-weight:900;margin-top:4px}.note{background:#fff8e6;border:1px solid #f1d38a;color:#6b4f0a;border-radius:15px;padding:12px;font-size:12px;line-height:1.55}.a-rail{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 7px}.a-card{min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}.stars{letter-spacing:1px;margin:7px 0}.check{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.check:last-child{border-bottom:0}.check input{margin-top:2px}.prep-card{margin-bottom:10px}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(15px);border-top:1px solid var(--line);z-index:20}.bottom-inner{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.bottom button{border:0;background:transparent;color:var(--muted);padding:8px 2px calc(8px + env(safe-area-inset-bottom));font-size:10px}.bottom button.active{color:var(--blue);font-weight:900}.ico{display:block;font-size:17px;margin-bottom:2px}.hidden{display:none}@media(min-width:700px){.hero{padding-left:28px;padding-right:28px}.section{padding-left:28px;padding-right:28px}}

<body><main class="app" id="app"></main><nav class="bottom"><div class="bottom-inner">
<button class="active" data-tab="home"><span class="ico">⌂</span>Home</button><button data-tab="itinerary"><span class="ico">▦</span>行程</button><button data-tab="transport"><span class="ico">✈</span>交通</button><button data-tab="places"><span class="ico">📍</span>地点</button><button data-tab="prepare"><span class="ico">✓</span>准备</button>
</div></nav>
<script>
let D=null,activeTab='home';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function localTarget(date,time,route=''){if(!time)return'';let r=(route||'').toLowerCase(),z=r.includes('kuala lumpur')?'+08:00':(r.includes('rovaniemi')||r.includes('helsinki'))?'+02:00':'+01:00';return `${date}T${time}:00${z}`}
function flightTarget(f){return f.departure_local?localTarget(f.date,f.departure_local,f.route):''}
function cd(t){let ms=new Date(t)-new Date();if(ms<=0)return'已到时间';let s=Math.floor(ms/1000),d=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);return `${d}天 ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`}
function maps(url,name){return url?`<a class="maps" href="${url}" target="_blank" rel="noopener">📍 ${esc(name)} · Google Maps →</a>`:''}
function nextFlight(){let now=new Date();return D.flights.map((f,i)=>({f,i,t:flightTarget(f)?new Date(flightTarget(f)):null})).filter(x=>x.t&&x.t>now)[0]||{f:D.flights[0],i:0,t:null}}
function progress(){let start=new Date('2027-01-31T00:00:00+08:00'),end=new Date('2027-02-11T23:59:59+01:00'),now=new Date();let p=Math.max(0,Math.min(100,(now-start)/(end-start)*100));return p}
function hero(){let n=nextFlight(),f=n.f;return `<header class="hero"><div class="eyebrow">🇫🇮 Finland · 🇳🇴 Norway · 5人同行 · V2</div><h1>${esc(D.trip.title)}</h1><p>${D.trip.start_date} — ${D.trip.end_date} · ${D.trip.days}天${D.trip.nights}夜</p><p class="route">${esc(D.trip.route)}</p><div class="progress"><div class="progress-top"><span>旅行进度</span><b>${Math.round(progress())}%</b></div><div class="bar"><i style="width:${progress()}%"></i></div></div></header>`}
function nextCard(){let n=nextFlight(),f=n.f;return `<section class="section"><div class="card next-card"><div class="next-title"><span class="mini-label">✈️ NEXT</span><span class="pill">${esc(f.flight_number)}</span></div><div class="next-big">${esc(f.route)}</div><div class="next-meta">${esc(f.date)} · 出发 ${esc(f.departure_local||'待确认')} · ${esc(f.airline)}</div><div class="countdown" style="margin-top:8px" data-target="${n.t?n.t.toISOString():''}">⏳ ${n.t?cd(n.t):'时间待确认'}</div></div></section>`}
function todayCard(){let now=new Date();let days=D.daily_itinerary;let idx=days.findIndex(d=>{let st=new Date(d.date+'T00:00:00+01:00'),en=new Date(d.date+'T23:59:59+01:00');return now>=st&&now<=en});let d=idx>=0?days[idx]:days[0];return `<section class="section"><div class="card today-card"><div class="mini-label">🗓️ TODAY / NEXT DAY</div><div class="today-title">D${d.day} · ${esc(d.location)}</div><div class="small">${esc(d.date)} · ${esc(d.country)} · 住宿：${esc(d.overnight)}</div><button class="btn secondary" onclick="openDay(${d.day})">查看当天行程 →</button></div></section>`}
function flightCard(f){let t=flightTarget(f),p=f.route.split(' → ');return `<article class="flight"><div class="top"><div><div class="airline">${esc(f.airline)}</div><div class="flight-title">Flight</div></div><span class="pill">${esc(f.flight_number)}</span></div><div class="flight-route"><div><div class="airport">${esc(p[0])}</div><div class="city">${esc(f.date)} · ${esc(f.departure_local||'待确认')}</div></div><div class="arrow">→</div><div><div class="airport">${esc(p[p.length-1])}</div><div class="city">${esc(f.arrival_local||f.final_arrival_local||'待确认')}</div></div></div><div class="countdown" data-target="${t}">⏳ ${t?cd(t):'出发时间待确认'}</div></article>`}
function dayCard(d){let links=Object.entries(d.google_maps||{}).map(([n,u])=>maps(u,n)).join('<br>');return `<article class="day" id="day-${d.day}"><div class="dayhead"><span class="daynum">D${d.day}</span><span class="date">${esc(d.date)} · ${esc(d.weekday)}</span></div><div class="route2">${esc(d.location)}</div><div class="meta">${esc((d.transport||[]).join(' · '))}<br>住宿：${esc(d.overnight)}</div><div class="details">${(d.schedule||[]).map(x=>`<div class="item"><div class="t">${esc(x.time||'')}</div><div>${esc(x.activity)}</div></div>`).join('')}<div>${links}</div>${(d.notes||[]).map(n=>`<div class="small" style="margin-top:8px">⚠️ ${esc(n)}</div>`).join('')}</div></article>`}
function car(){let c=D.car_rental;return `<section class="section"><h2>🚙 租车</h2><div class="sub">Lofoten 自驾核心资料</div><div class="card"><div class="mini-label">${esc(c.company)}</div><div class="car-title">${esc(c.vehicle)}</div><div class="grid2" style="margin-top:12px"><div class="kv"><small>取车</small><strong>2027/02/06 · EVE</strong></div><div class="kv"><small>还车</small><strong>2027/02/10 · EVE</strong></div></div><p class="small">🔒 Reservation reference：Private</p>${maps(D.google_maps['Evenes Airport'],'Evenes Airport')}</div></section>`}
function aurora(){return `<section class="section"><h2>🌌 极光</h2><div class="sub">天气 / 云量决定最终安排</div><div class="a-rail">${D.aurora_plan.map(a=>`<div class="a-card"><b>${esc(a.location)}</b><div class="small">${esc(a.date)} · ${esc(a.time)}</div><div class="stars">${esc(a.label)}</div><div class="small">优先级 ${a.priority}/4</div></div>`).join('')}</div></section>`}
function places(){let names=Object.keys(D.google_maps||{});return hero()+`<section class="section"><h2>📍 Places</h2><div class="sub">所有主要地点直接打开 Google Maps</div><div class="place-grid">${names.map(n=>`<div class="place"><b>${esc(n)}</b>${maps(D.google_maps[n],n)}</div>`).join('')}</div></section>`}
function home(){return hero()+nextCard()+todayCard()+`<section class="section"><h2>✈️ 交通快览</h2><div class="sub">左右滑动查看航班</div><div class="rail">${D.flights.map(flightCard).join('')}</div></section>`+car()+aurora()+`<section class="section"><div class="note">⚠️ 航班、火车、住宿、租车、道路、景点开放时间/票价及极光预报均须在出发前重新确认。</div></section>`}
function itinerary(){return hero()+`<section class="section"><h2>🗓️ 12天完整行程</h2><div class="sub">点击每天展开：时间 · 活动 · 地图 · 住宿 · 注意事项</div><div class="timeline">${D.daily_itinerary.map(dayCard).join('')}</div></section>`}
function transport(){return hero()+`<section class="section"><h2>✈️ Flights</h2><div class="rail">${D.flights.map(flightCard).join('')}</div></section><section class="section"><h2>🚆 VR Night Train</h2><div class="card"><b>VR265 · Sleeper Cabin</b><p>Helsinki → Rovaniemi</p><div class="small">2027/02/01 19:29 → 2027/02/02 07:20</div>${maps(D.google_maps['Helsinki Central Railway Station'],'Helsinki Central Railway Station')}${maps(D.google_maps['Rovaniemi Railway Station'],'Rovaniemi Railway Station')}</div></section>`+car()+`<section class="section"><h2>❄️ Winter Driving</h2><div class="note">${(D.driving_notes||D.car_rental.winter_driving_notes||[]).map(x=>'• '+esc(x)).join('<br>')}</div></section>`}
function prepare(){let p=D.preparation_and_packing;let groups=[['📄 文件与旅行',p.documents_and_travel],['🧥 冬季衣物',p.winter_clothing],['🔋 电子设备',p.electronics],['🚗 租车与道路',p.car_and_road_trip],['🌌 极光',p.aurora],['🧴 健康与舒适',p.health_and_comfort]];return hero()+`<section class="section"><h2>🎒 Prepare</h2><div class="sub">勾选状态会保存在本机浏览器</div>${groups.map(([g,a],gi)=>`<div class="card prep-card"><b>${g}</b>${(a||[]).map((x,i)=>{let id='p'+gi+'_'+i;return `<label class="check"><input data-check="${id}" type="checkbox"><span>${esc(x)}</span></label>`}).join('')}</div>`).join('')}<div class="card"><b>🛡️ 租车检查 / 保险</b><details><summary style="margin-top:11px">取车检查</summary><p class="small">拍摄车身四周、划痕、玻璃、灯、轮胎、仪表盘里程与油量；确认冬季胎/设备及还车地点。</p></details><details><summary>保险</summary><p class="small">实际保障以 Sixt Rental Agreement / Insurance Policy 为准。</p></details><details><summary>冬季驾驶</summary><p class="small">4WD 不能消除冰雪路面的刹车风险。冬季道路请预留缓冲时间。</p></details></div></section>`}
function bind(){document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));document.querySelectorAll('.day').forEach(x=>x.addEventListener('click',e=>{if(e.target.closest('a'))return;x.classList.toggle('open')}));document.querySelectorAll('[data-check]').forEach(c=>{let k='v2_'+c.dataset.check;c.checked=localStorage.getItem(k)==='1';c.addEventListener('change',()=>localStorage.setItem(k,c.checked?'1':'0'))});updateTimers()}
function render(tab){activeTab=tab;let html=tab==='home'?home():tab==='itinerary'?itinerary():tab==='transport'?transport():tab==='places'?places():prepare();$('#app').innerHTML=html;bind()}
function openDay(n){render('itinerary');setTimeout(()=>{let e=$('#day-'+n);if(e){e.classList.add('open');e.scrollIntoView({behavior:'smooth',block:'center'});}},80)}
function updateTimers(){document.querySelectorAll('[data-target]').forEach(e=>{if(e.dataset.target)e.textContent='⏳ '+cd(e.dataset.target)})}
